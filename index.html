<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My first App</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 40px 20px; text-align: center; background: linear-gradient(135deg, #e8f5e9 0%, #e3f2fd 50%, #fce4ec 100%); min-height: 100vh; }
h1 { margin-bottom: 8px; color: #4a148c; font-size: 36px; }
.buttons { display: flex; flex-direction: column; gap: 12px; }
.buttons a { display: block; font-size: 20px; padding: 18px; border: none; border-radius: 16px; text-decoration: none; color: white; background: linear-gradient(135deg, #7b1fa2, #512da8); box-shadow: 0 6px 16px rgba(0,0,0,0.15); transition: transform 0.15s; }
.buttons a:hover { transform: translateY(-2px) scale(1.02); }
.note { color: #666; font-size: 14px; margin-top: 24px; }
</style>
</head>
<body>
<div style="font-size:40px;">🌟</div>
<h1>My first App</h1>
<p style="color:#555;">Choose an app below</p>
<div class="buttons" id="buttons">
<a href="calculator.html">Calculator</a>
<a href="dictionary.html">Dictionary</a>
</div>
<p class="note" id="note">Yangi fayllar avtomatik ravishda shu yerga tugma bo'lib qo'shiladi.</p>
<script>
async function loadFiles() {
  try {
    const res = await fetch('https://api.github.com/repos/shokhidayasina/shokhidayasina.github.io/contents/');
    if (!res.ok) return;
    const files = await res.json();
    const container = document.getElementById('buttons');
    const existing = new Set(Array.from(container.querySelectorAll('a')).map(a => a.getAttribute('href')));
    files.forEach(f => {
      if (f.type !== 'file') return;
      if (f.name === 'index.html') return;
      let href, label;
      if (f.name.endsWith('.html')) {
        href = f.name;
        label = f.name.replace('.html', '').replace(/[-_]/g, ' ');
        label = label.charAt(0).toUpperCase() + label.slice(1);
      } else {
        href = 'https://github.com/shokhidayasina/shokhidayasina.github.io/blob/main/' + f.name;
        label = f.name;
      }
      if (existing.has(href)) return;
      existing.add(href);
      const a = document.createElement('a');
      a.href = href;
      a.textContent = label;
      container.appendChild(a);
    });
  } catch (e) {
    // If the API is unavailable, the static Calculator and Dictionary buttons above still work.
  }
}
loadFiles();
</script>
</body>
</html>
