<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obby Jump</title><style>
body{font-family:system-ui,sans-serif;text-align:center;background:#e1bee7;margin:0;padding:12px}
canvas{background:#b3e5fc;border:3px solid #6a1b9a;border-radius:12px;max-width:100%}
button{padding:10px 16px;border:none;border-radius:10px;background:#6a1b9a;color:#fff;cursor:pointer}
a{color:#6a1b9a}
</style></head><body>
<h1>🏃 Obby Jump</h1><p id="info">Level 1 | Coins: 0</p>
<canvas id="c" width="600" height="360"></canvas>
<p>Arrows / WASD to move, Space or ↑ to jump. Touch the left/right halves to move, tap top to jump. Avoid red lava, reach the 🏁 flag!</p>
<p><button onclick="startLevel(1)">↻ Restart</button> <a href="../games.html">← All games</a></p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let p,level,coins,plat,lava,flag,coinList,cp;
function startLevel(l){level=l;coins=coins||0;cp={x:20,y:300};
plat=[{x:0,y:330,w:600,h:30}];lava=[];coinList=[];flag={x:560,y:280};
if(l===1){plat.push({x:120,y:270,w:90,h:20},{x:260,y:220,w:90,h:20},{x:400,y:270,w:90,h:20});lava.push({x:200,y:330,w:60,h:30});coinList.push({x:165,y:240},{x:305,y:190},{x:445,y:240});}
else if(l===2){plat.push({x:100,y:280,w:70,h:20},{x:200,y:230,w:70,h:20},{x:300,y:280,w:70,h:20},{x:410,y:220,w:70,h:20});lava.push({x:160,y:330,w:40,h:30},{x:360,y:330,w:50,h:30});coinList.push({x:135,y:250},{x:235,y:200},{x:445,y:190});}
else{plat.push({x:90,y:280,w:60,h:18},{x:180,y:230,w:60,h:18},{x:270,y:270,w:60,h:18},{x:360,y:210,w:60,h:18},{x:460,y:260,w:60,h:18});lava.push({x:140,y:330,w:40,h:30},{x:320,y:330,w:40,h:30});coinList.push({x:120,y:250},{x:300,y:240},{x:490,y:230});}
p={x:20,y:300,w:24,h:28,vx:0,vy:0,ground:false};update()}
function update(){document.getElementById('info').textContent=`Level ${level} | Coins: ${coins} | Checkpoint saved at start`}
const keys={};addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();if(p.ground){p.vy=-13;p.ground=false}}});
addEventListener('keyup',e=>keys[e.key]=false);
cv.addEventListener('touchstart',e=>{const r=cv.getBoundingClientRect();const x=e.touches[0].clientX-r.left;if(e.touches[0].clientY-r.top<120){if(p.ground){p.vy=-13;p.ground=false}}else if(x<300)keys.left=true;else keys.right=true});
cv.addEventListener('touchend',()=>{keys.left=false;keys.right=false});
function loop(){
p.vx=0;if(keys.ArrowLeft||keys.a||keys.left)p.vx=-4;if(keys.ArrowRight||keys.d||keys.right)p.vx=4;
p.vy+=0.6;p.x+=p.vx;p.y+=p.vy;p.ground=false;
for(const q of plat){if(p.x<q.x+q.w&&p.x+p.w>q.x&&p.y<q.y+q.h&&p.y+p.h>q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.ground=true;cp={x:p.x,y:p.y}}}
for(const q of lava){if(p.x<q.x+q.w&&p.x+p.w>q.x&&p.y<q.y+q.h&&p.y+p.h>q.y){p.x=cp.x;p.y=cp.y;p.vx=0;p.vy=0}}
coinList=coinList.filter(c=>{if(Math.hypot(c.x-(p.x+12),c.y-(p.y+14))<28){coins++;update();return false}return true});
if(p.x+p.w>flag.x&&p.y>flag.y-50){if(level<3){alert('Level '+level+' complete!');startLevel(level+1)}else{alert('You beat all 3 levels! Coins: '+coins);startLevel(1)}}
if(p.y>400){p.x=cp.x;p.y=cp.y;p.vy=0}
ctx.clearRect(0,0,600,360);ctx.fillStyle='#b3e5fc';ctx.fillRect(0,0,600,360);
ctx.fillStyle='#7b1fa2';for(const q of plat)ctx.fillRect(q.x,q.y,q.w,q.h);
ctx.fillStyle='#e53935';for(const q of lava)ctx.fillRect(q.x,q.y,q.w,q.h);
ctx.fillStyle='#ffeb3b';for(const c of coinList){ctx.beginPath();ctx.arc(c.x,c.y,10,0,7);ctx.fill()}
ctx.font='30px serif';ctx.fillText('🏁',flag.x,flag.y+30);
ctx.fillStyle='#ff5722';ctx.fillRect(p.x,p.y,p.w,p.h);
requestAnimationFrame(loop)}
startLevel(1);loop();
</script></body></html>
