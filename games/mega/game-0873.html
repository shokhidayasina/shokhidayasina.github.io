<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deep Sea Breaker — Hard</title><style>body{font-family:system-ui,sans-serif;margin:0;text-align:center;background:linear-gradient(135deg,#082f49,#0ea5e9);color:#fff;min-height:100vh}canvas{display:block;width:100%;max-width:460px;height:500px;margin:12px auto;background:rgba(0,0,0,.35);border-radius:16px}button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:#facc15;cursor:pointer;margin:4px}a{color:#fff}.bar{display:flex;justify-content:space-between;max-width:460px;margin:0 auto;padding:0 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:12px auto}.cell{aspect-ratio:1;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}.tile{aspect-ratio:1;border-radius:12px;cursor:pointer}</style></head><body><h1>Deep Sea Breaker — Hard</h1><p>Move the paddle with ← → or drag. Bounce the ball and clear all the bricks!</p><div class="bar"><span id="score">Score: 0</span><span id="extra"></span></div><canvas id="c" width="460" height="500"></canvas><p><button id="start">▶ Start / Restart</button></p><p><a href="../../mega-games.html">← Back to 1000 Games</a></p><script>const PLAYER="\ud83d\udc19",GOOD="\ud83e\uddaa",BAD="\ud83e\udd88";const cv=document.getElementById('c'),x=cv.getContext('2d');let px,bx,by,vx,vy,bricks,score,over,win;function reset(){px=200;bx=230;by=400;vx=2.5*1.25;vy=-2.5*1.25;score=0;over=false;win=false;bricks=[];for(let r=0;r<5;r++)for(let c=0;c<6;c++)bricks.push({x:20+c*72,y:30+r*28,alive:true});}function loop(){if(!over&&!win){bx+=vx;by+=vy;if(bx<10||bx>450)vx=-vx;if(by<10)vy=-vy;if(by>430&&bx>px&&bx<px+90)vy=-Math.abs(vy);for(const b of bricks)if(b.alive&&bx>b.x&&bx<b.x+66&&by>b.y&&by<b.y+22){b.alive=false;vy=-vy;score+=10;}if(bricks.every(b=>!b.alive))win=true;if(by>500)over=true;document.getElementById('score').textContent='Score: '+score;}x.clearRect(0,0,460,500);x.fillStyle='#facc15';x.fillRect(px,450,90,14);x.beginPath();x.arc(bx,by,10,0,7);x.fill();x.fillStyle='#22d3ee';for(const b of bricks)if(b.alive)x.fillRect(b.x,b.y,66,22);if(over||win){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,200,460,80);x.fillStyle='#fff';x.font='bold 24px system-ui';x.fillText(win?'You cleared them all!':'Ball lost! Score: '+score,110,250);}requestAnimationFrame(loop);}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')px-=26;if(e.key==='ArrowRight')px+=26;px=Math.max(0,Math.min(370,px));});cv.addEventListener('touchmove',e=>{px=e.touches[0].clientX-cv.getBoundingClientRect().left-45;},{passive:true});document.getElementById('start').onclick=reset;reset();loop();</script></body></html>
