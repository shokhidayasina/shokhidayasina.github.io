<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mountain Popper — Easy</title><style>body{font-family:system-ui,sans-serif;margin:0;text-align:center;background:linear-gradient(135deg,#334155,#94a3b8);color:#fff;min-height:100vh}canvas{display:block;width:100%;max-width:460px;height:500px;margin:12px auto;background:rgba(0,0,0,.35);border-radius:16px}button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:#facc15;cursor:pointer;margin:4px}a{color:#fff}.bar{display:flex;justify-content:space-between;max-width:460px;margin:0 auto;padding:0 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:12px auto}.cell{aspect-ratio:1;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}.tile{aspect-ratio:1;border-radius:12px;cursor:pointer}</style></head><body><h1>Mountain Popper — Easy</h1><p>Tap the targets as fast as you can! You have 30 seconds.</p><div class="bar"><span id="score">Score: 0</span><span id="extra"></span></div><canvas id="c" width="460" height="500"></canvas><p><button id="start">▶ Start / Restart</button></p><p><a href="../../mega-games.html">← Back to 1000 Games</a></p><script>const PLAYER="\ud83c\udfd4\ufe0f",GOOD="\u26cf\ufe0f",BAD="\ud83e\udd85";const cv=document.getElementById('c'),x=cv.getContext('2d');let tg,score,time,over,timer;function reset(){score=0;time=30;over=false;tg=null;clearInterval(timer);timer=setInterval(()=>{time--;if(time<=0){over=true;clearInterval(timer);}} ,1000);spawn();}function spawn(){if(over)return;tg={x:40+Math.random()*380,y:40+Math.random()*400};setTimeout(()=>{if(!over)spawn();},Math.max(600,1100-0*80));}function loop(){x.clearRect(0,0,460,500);x.font='44px system-ui';if(tg&&!over)x.fillText(GOOD,tg.x-22,tg.y+16);x.fillStyle='#fff';x.font='20px system-ui';x.fillText('Time: '+time,20,30);document.getElementById('score').textContent='Score: '+score;if(over){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,200,460,80);x.fillStyle='#fff';x.font='bold 24px system-ui';x.fillText('Time up! Score: '+score,120,250);}requestAnimationFrame(loop);}cv.addEventListener('click',e=>{if(!tg||over)return;const r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;if(Math.abs(mx-tg.x)<35&&Math.abs(my-tg.y)<35){score+=10;spawn();}});document.getElementById('start').onclick=reset;reset();loop();</script></body></html>
