<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volcano Catcher — Easy</title><style>body{font-family:system-ui,sans-serif;margin:0;text-align:center;background:linear-gradient(135deg,#450a0a,#ef4444);color:#fff;min-height:100vh}canvas{display:block;width:100%;max-width:460px;height:500px;margin:12px auto;background:rgba(0,0,0,.35);border-radius:16px}button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:#facc15;cursor:pointer;margin:4px}a{color:#fff}.bar{display:flex;justify-content:space-between;max-width:460px;margin:0 auto;padding:0 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:12px auto}.cell{aspect-ratio:1;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}.tile{aspect-ratio:1;border-radius:12px;cursor:pointer}</style></head><body><h1>Volcano Catcher — Easy</h1><p>Move with ← → or drag. Catch the good items, avoid hazards. Reach 60 points to win!</p><div class="bar"><span id="score">Score: 0</span><span id="extra"></span></div><canvas id="c" width="460" height="500"></canvas><p><button id="start">▶ Start / Restart</button></p><p><a href="../../mega-games.html">← Back to 1000 Games</a></p><script>const PLAYER="\ud83c\udf0b",GOOD="\ud83d\udc8e",BAD="\ud83d\udd25";const cv=document.getElementById('c'),x=cv.getContext('2d');let px,items,score,over,win,t;function reset(){px=230;items=[];score=0;over=false;win=false;t=0;}function loop(){if(!over&&!win){t++;if(t%40===0)items.push({x:Math.random()*420,y:-20,bad:Math.random()<.35});for(const it of items)it.y+=2.4000000000000004;items=items.filter(it=>it.y<530);for(const it of items)if(it.y>440&&it.y<480&&Math.abs(px-it.x)<38){score+=it.bad?-20:10;it.y=600;if(score>=60)win=true;}document.getElementById('score').textContent='Score: '+score+' / 60';}x.clearRect(0,0,460,500);x.font='40px system-ui';x.fillText('🧺',px-20,475);for(const it of items)x.fillText(it.bad?BAD:GOOD,it.x-20,it.y);if(win||over){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,200,460,80);x.fillStyle='#fff';x.font='bold 24px system-ui';x.fillText(win?'You win! Score: '+score:'',130,250);}requestAnimationFrame(loop);}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')px-=30;if(e.key==='ArrowRight')px+=30;px=Math.max(20,Math.min(440,px));});cv.addEventListener('touchmove',e=>{px=e.touches[0].clientX-cv.getBoundingClientRect().left;},{passive:true});document.getElementById('start').onclick=reset;reset();loop();</script></body></html>
