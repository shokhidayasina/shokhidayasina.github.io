<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm Snake — Expert</title><style>body{font-family:system-ui,sans-serif;margin:0;text-align:center;background:linear-gradient(135deg,#14532d,#facc15);color:#fff;min-height:100vh}canvas{display:block;width:100%;max-width:460px;height:500px;margin:12px auto;background:rgba(0,0,0,.35);border-radius:16px}button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:#facc15;cursor:pointer;margin:4px}a{color:#fff}.bar{display:flex;justify-content:space-between;max-width:460px;margin:0 auto;padding:0 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:12px auto}.cell{aspect-ratio:1;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}.tile{aspect-ratio:1;border-radius:12px;cursor:pointer}</style></head><body><h1>Farm Snake — Expert</h1><p>Move with arrows or swipe. Eat the good items, grow, do not hit walls or yourself!</p><div class="bar"><span id="score">Score: 0</span><span id="extra"></span></div><canvas id="c" width="460" height="500"></canvas><p><button id="start">▶ Start / Restart</button></p><p><a href="../../mega-games.html">← Back to 1000 Games</a></p><script>const PLAYER="\ud83d\udc04",GOOD="\ud83e\udd55",BAD="\ud83d\udc3a";const cv=document.getElementById('c'),x=cv.getContext('2d');let sn,dir,food,score,over,t,last;function reset(){sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};food={x:15,y:10};score=0;over=false;last=0;}function loop(ts){if(!over&&ts-last>145){last=ts;const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};if(h.x<0||h.y<0||h.x>=23||h.y>=25||sn.some(s=>s.x===h.x&&s.y===h.y))over=true;else{sn.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;food={x:Math.floor(Math.random()*23),y:Math.floor(Math.random()*25)};}else sn.pop();}}x.clearRect(0,0,460,500);x.font='20px system-ui';sn.forEach((s,i)=>x.fillText(i===0?PLAYER:GOOD,s.x*20,s.y*20+18));x.fillText(GOOD,food.x*20,food.y*20+18);document.getElementById('score').textContent='Score: '+score;if(over){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,200,460,80);x.fillStyle='#fff';x.font='bold 24px system-ui';x.fillText('Game over! Score: '+score,110,250);}requestAnimationFrame(loop);}addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&dir.y!==1)dir={x:0,y:-1};if(e.key==='ArrowDown'&&dir.y!==-1)dir={x:0,y:1};if(e.key==='ArrowLeft'&&dir.x!==1)dir={x:-1,y:0};if(e.key==='ArrowRight'&&dir.x!==-1)dir={x:1,y:0};});let sx,sy;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy))dir=dx>0?{x:1,y:0}:{x:-1,y:0};else dir=dy>0?{x:0,y:1}:{x:0,y:-1};});document.getElementById('start').onclick=reset;reset();requestAnimationFrame(loop);</script></body></html>
