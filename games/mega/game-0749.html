<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sports Color Match — Expert</title><style>body{font-family:system-ui,sans-serif;margin:0;text-align:center;background:linear-gradient(135deg,#052e16,#22c55e);color:#fff;min-height:100vh}canvas{display:block;width:100%;max-width:460px;height:500px;margin:12px auto;background:rgba(0,0,0,.35);border-radius:16px}button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:#facc15;cursor:pointer;margin:4px}a{color:#fff}.bar{display:flex;justify-content:space-between;max-width:460px;margin:0 auto;padding:0 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:12px auto}.cell{aspect-ratio:1;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}.tile{aspect-ratio:1;border-radius:12px;cursor:pointer}</style></head><body><h1>Sports Color Match — Expert</h1><p>Tap the tile with the named color. Be fast — you have 30 seconds!</p><div class="bar"><span id="score">Score: 0</span><span id="extra"></span></div><div class="grid" id="grid" style="grid-template-columns:repeat(3,1fr)"></div><p><button id="start">▶ Start / Restart</button></p><p><a href="../../mega-games.html">← Back to 1000 Games</a></p><script>const PLAYER="\u26bd",GOOD="\ud83c\udfc6",BAD="\ud83e\udd45";const COLS=['red', 'blue', 'green', 'yellow', 'purple', 'orange'];let target,score,time,over,timer;function round(){target=COLS[Math.floor(Math.random()*COLS.length)];const g=document.getElementById('grid');g.innerHTML='';const opts=[target,...COLS.filter(c=>c!==target).sort(()=>Math.random()-.5).slice(0,8)].sort(()=>Math.random()-.5);opts.forEach(c=>{const t=document.createElement('div');t.className='tile';t.style.background=c;t.onclick=()=>{if(over)return;if(c===target){score+=10;round();}else score=Math.max(0,score-5);document.getElementById('score').textContent='Score: '+score;};g.appendChild(t);});document.getElementById('extra').textContent='Find: '+target;}function reset(){score=0;time=30;over=false;clearInterval(timer);timer=setInterval(()=>{time--;if(time<=0){over=true;clearInterval(timer);document.getElementById('extra').textContent='Time up!';}} ,1000);round();document.getElementById('score').textContent='Score: 0';}document.getElementById('start').onclick=reset;reset();</script></body></html>
