<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruit Flyer — Easy</title><style>body{font-family:system-ui,sans-serif;margin:0;text-align:center;background:linear-gradient(135deg,#881337,#fb7185);color:#fff;min-height:100vh}canvas{display:block;width:100%;max-width:460px;height:500px;margin:12px auto;background:rgba(0,0,0,.35);border-radius:16px}button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:#facc15;cursor:pointer;margin:4px}a{color:#fff}.bar{display:flex;justify-content:space-between;max-width:460px;margin:0 auto;padding:0 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:12px auto}.cell{aspect-ratio:1;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}.tile{aspect-ratio:1;border-radius:12px;cursor:pointer}</style></head><body><h1>Fruit Flyer — Easy</h1><p>Tap, click, or press Space to flap. Fly through the gaps!</p><div class="bar"><span id="score">Score: 0</span><span id="extra"></span></div><canvas id="c" width="460" height="500"></canvas><p><button id="start">▶ Start / Restart</button></p><p><a href="../../mega-games.html">← Back to 1000 Games</a></p><script>const PLAYER="\ud83c\udf53",GOOD="\ud83c\udf4e",BAD="\ud83c\udf4b";const cv=document.getElementById('c'),x=cv.getContext('2d');let y,vy,pipes,score,over;function reset(){y=250;vy=0;pipes=[];score=0;over=false;for(let i=0;i<3;i++)pipes.push({x:300+i*180,gap:80+Math.random()*260});}function flap(){vy=-7;}function loop(){if(!over){vy+=0.45;y+=vy;for(const p of pipes){p.x-=2.2*0.8;if(p.x===118)score++;}if(pipes[0].x<-60){pipes.shift();pipes.push({x:pipes[pipes.length-1].x+180,gap:80+Math.random()*260});}for(const p of pipes)if(120>p.x-20&&120<p.x+60&&(y< p.gap-70||y>p.gap+70))over=true;if(y<0||y>500)over=true;document.getElementById('score').textContent='Score: '+score;}x.clearRect(0,0,460,500);x.fillStyle='#22d3ee';for(const p of pipes){x.fillRect(p.x,0,60,p.gap-70);x.fillRect(p.x,p.gap+70,60,500);}x.font='40px system-ui';x.fillText(PLAYER,100,y);if(over){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,200,460,80);x.fillStyle='#fff';x.font='bold 24px system-ui';x.fillText('Crashed! Score: '+score,120,250);}requestAnimationFrame(loop);}addEventListener('keydown',e=>{if(e.code==='Space')flap();});cv.addEventListener('click',flap);cv.addEventListener('touchstart',e=>{flap();e.preventDefault();},{passive:false});document.getElementById('start').onclick=reset;reset();loop();</script></body></html>
