<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space Blaster — Master</title><style>body{font-family:system-ui,sans-serif;margin:0;text-align:center;background:linear-gradient(135deg,#0f172a,#7c3aed);color:#fff;min-height:100vh}canvas{display:block;width:100%;max-width:460px;height:500px;margin:12px auto;background:rgba(0,0,0,.35);border-radius:16px}button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:#facc15;cursor:pointer;margin:4px}a{color:#fff}.bar{display:flex;justify-content:space-between;max-width:460px;margin:0 auto;padding:0 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:12px auto}.cell{aspect-ratio:1;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}.tile{aspect-ratio:1;border-radius:12px;cursor:pointer}</style></head><body><h1>Space Blaster — Master</h1><p>Move with ← →, press Space or tap Shoot to fire. Blast the hazards before they reach you!</p><div class="bar"><span id="score">Score: 0</span><span id="extra"></span></div><canvas id="c" width="460" height="500"></canvas><p><button id="shoot">🔫 Shoot</button></p><p><button id="start">▶ Start / Restart</button></p><p><a href="../../mega-games.html">← Back to 1000 Games</a></p><script>const PLAYER="\ud83d\ude80",GOOD="\u2b50",BAD="\u2604\ufe0f";const cv=document.getElementById('c'),x=cv.getContext('2d');let px,bul,ene,score,over,t;function reset(){px=230;bul=[];ene=[];score=0;over=false;t=0;}function shoot(){bul.push({x:px,y:440});}function loop(){if(!over){t++;if(t%Math.max(25,Math.floor(55/1.8))===0)ene.push({x:Math.random()*420,y:0});for(const b of bul)b.y-=9;for(const e of ene)e.y+=1.2*1.8;bul=bul.filter(b=>b.y>0);ene=ene.filter(e=>e.y<520);for(const b of bul)for(const e of ene)if(Math.abs(b.x-e.x)<30&&Math.abs(b.y-e.y)<30){score+=10;b.y=-10;e.y=600;}for(const e of ene)if(e.y>470)over=true;document.getElementById('score').textContent='Score: '+score;}x.clearRect(0,0,460,500);x.font='40px system-ui';x.fillText(PLAYER,px-20,470);for(const b of bul)x.fillText('•',b.x-8,b.y);for(const e of ene)x.fillText(BAD,e.x-20,e.y);if(over){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,200,460,80);x.fillStyle='#fff';x.font='bold 24px system-ui';x.fillText('Game over! Score: '+score,110,250);}requestAnimationFrame(loop);}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')px-=28;if(e.key==='ArrowRight')px+=28;if(e.key===' ')shoot();px=Math.max(20,Math.min(440,px));});cv.addEventListener('touchmove',e=>{px=e.touches[0].clientX-cv.getBoundingClientRect().left;},{passive:true});document.getElementById('shoot').onclick=shoot;document.getElementById('start').onclick=reset;reset();loop();</script></body></html>
