<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halloween Memory — Expert</title><style>body{font-family:system-ui,sans-serif;margin:0;text-align:center;background:linear-gradient(135deg,#1a1005,#f97316);color:#fff;min-height:100vh}canvas{display:block;width:100%;max-width:460px;height:500px;margin:12px auto;background:rgba(0,0,0,.35);border-radius:16px}button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:#facc15;cursor:pointer;margin:4px}a{color:#fff}.bar{display:flex;justify-content:space-between;max-width:460px;margin:0 auto;padding:0 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:12px auto}.cell{aspect-ratio:1;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}.tile{aspect-ratio:1;border-radius:12px;cursor:pointer}</style></head><body><h1>Halloween Memory — Expert</h1><p>Tap two cards to find a matching pair. Find all 8 pairs!</p><div class="bar"><span id="score">Score: 0</span><span id="extra"></span></div><div class="grid" id="grid"></div><p><button id="start">▶ Start / Restart</button></p><p><a href="../../mega-games.html">← Back to 1000 Games</a></p><script>const PLAYER="\ud83c\udf83",GOOD="\ud83c\udf6c",BAD="\ud83d\udc7b";const EM=['🐶', '🐱', '🦁', '🐸', '🦊', '🐼', '🐯', '🦄'];let cards,first,lock,found;function reset(){cards=[...EM,...EM].sort(()=>Math.random()-.5);first=null;lock=false;found=0;const g=document.getElementById('grid');g.innerHTML='';cards.forEach((e,i)=>{const d=document.createElement('div');d.className='cell';d.textContent='❓';d.onclick=()=>{if(lock||d.textContent!== '❓')return;d.textContent=e;if(!first)first=d;else{const p=first;first=null;if(p.textContent===e){found++;document.getElementById('score').textContent='Pairs found: '+found;if(found===8)document.getElementById('score').textContent='You found them all!';}else{lock=true;setTimeout(()=>{p.textContent='❓';d.textContent='❓';lock=false;},700);}}};g.appendChild(d);});document.getElementById('score').textContent='Pairs found: 0';}document.getElementById('start').onclick=reset;reset();</script></body></html>
