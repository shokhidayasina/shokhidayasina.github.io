<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winter Dodge — Master</title><style>body{font-family:system-ui,sans-serif;margin:0;text-align:center;background:linear-gradient(135deg,#0c4a6e,#e0f2fe);color:#fff;min-height:100vh}canvas{display:block;width:100%;max-width:460px;height:500px;margin:12px auto;background:rgba(0,0,0,.35);border-radius:16px}button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:#facc15;cursor:pointer;margin:4px}a{color:#fff}.bar{display:flex;justify-content:space-between;max-width:460px;margin:0 auto;padding:0 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:12px auto}.cell{aspect-ratio:1;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}.tile{aspect-ratio:1;border-radius:12px;cursor:pointer}</style></head><body><h1>Winter Dodge — Master</h1><p>Move with ← → or drag your finger. Dodge the hazards, survive and score!</p><div class="bar"><span id="score">Score: 0</span><span id="extra"></span></div><canvas id="c" width="460" height="500"></canvas><p><button id="start">▶ Start / Restart</button></p><p><a href="../../mega-games.html">← Back to 1000 Games</a></p><script>const PLAYER="\u26c4",GOOD="\u2744\ufe0f",BAD="\ud83e\uddca";const cv=document.getElementById('c'),x=cv.getContext('2d');let px,obs,score,lives,over,t;function reset(){px=230;obs=[];score=0;lives=3;over=false;t=0;document.getElementById('extra').textContent='Lives: 3';}function loop(){if(!over){t++;score++;if(t%Math.max(18,Math.floor(45/5.4))===0)obs.push({x:Math.random()*420,y:-30});for(const o of obs)o.y+=5.4;obs=obs.filter(o=>o.y<530);for(const o of obs)if(Math.abs(px-o.x)<32&&o.y>420&&o.y<480){lives--;o.y=600;document.getElementById('extra').textContent='Lives: '+lives;if(lives<=0)over=true;}document.getElementById('score').textContent='Score: '+score;}x.clearRect(0,0,460,500);x.font='40px system-ui';x.fillText(PLAYER,px-20,470);for(const o of obs)x.fillText(BAD,o.x-20,o.y);if(over){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,200,460,80);x.fillStyle='#fff';x.font='bold 24px system-ui';x.fillText('Game over! Score: '+score,110,250);}requestAnimationFrame(loop);}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')px-=28;if(e.key==='ArrowRight')px+=28;px=Math.max(20,Math.min(440,px));});cv.addEventListener('touchmove',e=>{px=e.touches[0].clientX-cv.getBoundingClientRect().left;},{passive:true});document.getElementById('start').onclick=reset;reset();loop();</script></body></html>
