<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City Stacker — Master</title><style>body{font-family:system-ui,sans-serif;margin:0;text-align:center;background:linear-gradient(135deg,#1f2937,#f59e0b);color:#fff;min-height:100vh}canvas{display:block;width:100%;max-width:460px;height:500px;margin:12px auto;background:rgba(0,0,0,.35);border-radius:16px}button{border:0;border-radius:999px;padding:11px 18px;font-weight:800;background:#facc15;cursor:pointer;margin:4px}a{color:#fff}.bar{display:flex;justify-content:space-between;max-width:460px;margin:0 auto;padding:0 12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:12px auto}.cell{aspect-ratio:1;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer}.tile{aspect-ratio:1;border-radius:12px;cursor:pointer}</style></head><body><h1>City Stacker — Master</h1><p>Press Space or tap when the moving bar is over the tower. Stack 8 layers to win!</p><div class="bar"><span id="score">Score: 0</span><span id="extra"></span></div><canvas id="c" width="460" height="500"></canvas><p><button id="start">▶ Start / Restart</button></p><p><a href="../../mega-games.html">← Back to 1000 Games</a></p><script>const PLAYER="\ud83d\ude95",GOOD="\ud83d\udcb0",BAD="\ud83d\udea7";const cv=document.getElementById('c'),x=cv.getContext('2d');let bx,bw,dir,layers,over,win;function reset(){bx=0;bw=180;dir=2+4*0.7;layers=0;over=false;win=false;}function drop(){if(over||win)return;const center=230;const off=Math.abs((bx+bw/2)-center);if(off>bw/2){over=true;}else{bw=Math.max(40,bw-off);layers++;if(layers>=8)win=true;bx=0;}}function loop(){if(!over&&!win){bx+=dir;if(bx+bw>460||bx<0)dir=-dir;}x.clearRect(0,0,460,500);x.fillStyle='#facc15';x.fillRect(140,430,180,50);for(let i=0;i<layers;i++)x.fillRect(180,380-i*30,120,26);x.fillStyle='#22d3ee';x.fillRect(bx,120,bw,26);document.getElementById('score').textContent='Layers: '+layers+' / 8';if(over||win){x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,200,460,80);x.fillStyle='#fff';x.font='bold 24px system-ui';x.fillText(win?'Tower complete!':'Missed! Layers: '+layers,120,250);}requestAnimationFrame(loop);}addEventListener('keydown',e=>{if(e.code==='Space')drop();});cv.addEventListener('click',drop);document.getElementById('start').onclick=reset;reset();loop();</script></body></html>
