<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake</title><style>
body{font-family:system-ui,sans-serif;text-align:center;background:#fff9c4;margin:0;padding:12px}
canvas{background:#e8f5e9;border:3px solid #33691e;border-radius:12px;max-width:100%;touch-action:none}
button{padding:10px 16px;border:none;border-radius:10px;background:#33691e;color:#fff;cursor:pointer}
a{color:#33691e}
</style></head><body>
<h1>🐍 Snake</h1><p id="info">Score: 0</p>
<canvas id="c" width="400" height="400"></canvas>
<p>Arrows / WASD, or swipe. Eat 🍎 to grow — don't hit the wall or yourself!</p>
<p><button onclick="start()">▶ Restart</button> <a href="../games.html">← All games</a></p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),N=20,S=20;
let snake,dir,next,food,score,timer;
function placeFood(){food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
function start(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;placeFood();clearInterval(timer);timer=setInterval(step,140);draw()}
function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){clearInterval(timer);alert('Game over! Score: '+score);return}
snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;placeFood();if(timer){clearInterval(timer);timer=setInterval(step,Math.max(70,140-score))}}else snake.pop();
document.getElementById('info').textContent='Score: '+score;draw()}
function draw(){ctx.clearRect(0,0,400,400);ctx.fillStyle='#e53935';ctx.font='18px serif';ctx.textAlign='center';ctx.fillText('🍎',food.x*S+10,food.y*S+15);ctx.fillStyle='#33691e';for(const s of snake)ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2)}
addEventListener('keydown',e=>{const k=e.key;if((k==='ArrowUp'||k==='w')&&dir.y!==1)next={x:0,y:-1};if((k==='ArrowDown'||k==='s')&&dir.y!==-1)next={x:0,y:1};if((k==='ArrowLeft'||k==='a')&&dir.x!==1)next={x:-1,y:0};if((k==='ArrowRight'||k==='d')&&dir.x!==-1)next={x:1,y:0}});
let sx,sy;cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});
cv.addEventListener('touchmove',e=>{e.preventDefault();const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.abs(dx)>20||Math.abs(dy)>20){if(Math.abs(dx)>Math.abs(dy))next=dx>0?{x:1,y:0}:{x:-1,y:0};else next=dy>0?{x:0,y:1}:{x:0,y:-1};sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:false});
start();
</script></body></html>
