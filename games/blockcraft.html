<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BlockCraft</title><style>
body{font-family:system-ui,sans-serif;text-align:center;background:#c8e6c9;margin:0;padding:12px}
canvas{border:3px solid #5d4037;border-radius:8px;max-width:100%;background:#87ceeb;cursor:pointer}
.pal button{font-size:26px;padding:8px;border:3px solid transparent;border-radius:10px;cursor:pointer;background:#fff}
.pal button.sel{border-color:#ff5722}
button.action{padding:10px 16px;border:none;border-radius:10px;background:#5d4037;color:#fff;cursor:pointer}
a{color:#5d4037}
</style></head><body>
<h1>🧱 BlockCraft</h1><p>Minecraft-style building — tap a square to place or remove a block.</p>
<div class="pal" id="pal"></div>
<p><button class="action" onclick="setMode('build')">🔨 Build mode</button> <button class="action" onclick="setMode('break')">⛏️ Break mode</button> <button class="action" onclick="gen()">🌍 New world</button> <button class="action" onclick="clearAll()">🗑️ Clear</button></p>
<p id="mode">Mode: Build | Block: 🌱 Grass</p>
<canvas id="c" width="600" height="360"></canvas>
<p><a href="../games.html">← All games</a></p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),COLS=20,ROWS=12,S=30;
const blocks=[['🌱 Grass','#7cb342'],['🟫 Dirt','#8d6e63'],['⬜ Stone','#9e9e9e'],['🪵 Wood','#795548'],['🍃 Leaves','#388e3c'],['🏖️ Sand','#ffe082'],['🧱 Brick','#b71c1c'],['💧 Water','#4fc3f7']];
let sel=0,mode='build',grid=[];
function gen(){grid=[];for(let y=0;y<ROWS;y++){let row=[];for(let x=0;x<COLS;x++){let b=-1;const h=7+Math.floor(Math.sin(x*0.7)*1.5);if(y===h)b=0;else if(y>h&&y<h+3)b=1;else if(y>=h+3)b=2;if(y===h&&Math.random()<0.15)b=3;row.push(b)}grid.push(row)}draw()}
function clearAll(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(-1));draw()}
function setMode(m){mode=m;show()}
function show(){document.getElementById('mode').textContent=`Mode: ${mode==='build'?'Build':'Break'} | Block: ${blocks[sel][0]}`}
function draw(){ctx.clearRect(0,0,600,360);ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,600,360);
for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ctx.strokeStyle='rgba(0,0,0,.15)';ctx.strokeRect(x*S,y*S,S,S);if(grid[y][x]>=0){ctx.fillStyle=blocks[grid[y][x]][1];ctx.fillRect(x*S,y*S,S,S);ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(blocks[grid[y][x]][0].split(' ')[0],x*S+15,y*S+15)}}}
const pal=document.getElementById('pal');
blocks.forEach((b,i)=>{const btn=document.createElement('button');btn.textContent=b[0].split(' ')[0];btn.title=b[0];btn.onclick=()=>{sel=i;document.querySelectorAll('.pal button').forEach(e=>e.classList.remove('sel'));btn.classList.add('sel');show()};if(i===0)btn.classList.add('sel');pal.appendChild(btn)});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)*COLS/r.width),y=Math.floor((e.clientY-r.top)*ROWS/r.height);if(x<0||y<0||x>=COLS||y>=ROWS)return;grid[y][x]=mode==='build'?sel:-1;draw()});
gen();show();
</script></body></html>
